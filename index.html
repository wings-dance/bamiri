<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1c1c1e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="バミリ帳"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>バミリ帳</title>
<style>:root{--bg:#1c1c1e;--card:#2a2a2d;--ink:#ececee;--line:#3a3a3e;--mut:#9a9aa0;--field:#333336;--acc:#b9b9c0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.1em;color:var(--mut)}
header input{flex:1;min-width:0;background:transparent;color:var(--ink);border:none;text-align:center;font-size:18px;font-weight:500;padding:6px}
button{border:none;background:var(--field);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;min-height:36px}
button.main{background:var(--acc);color:#1c1c1e;font-weight:600}button:active{filter:brightness(1.25)}button:disabled{opacity:.35}
#wrap{display:flex;flex-direction:column;gap:10px;padding:10px;max-width:1400px;margin:auto}
@media(min-width:700px){#side{display:grid;grid-template-columns:1fr 1fr;gap:10px}#side .card{margin-top:0!important}}
@media(min-width:1000px){#wrap{flex-direction:row;align-items:flex-start}#left{flex:1;min-width:0}#side{width:330px;display:block}#side .card+.card{margin-top:10px!important}}
.card{background:var(--card);border-radius:14px;padding:10px}
#scenes{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.scene{flex:none;padding:7px 14px;border-radius:999px;background:var(--field);font-size:14px;cursor:pointer}
.scene.on{background:var(--acc);color:#1c1c1e;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#box{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:none}
svg#stage{width:100%;margin:auto;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#coord{font-size:13px;text-align:center;margin-top:4px;min-height:20px;color:var(--mut)}
.zoom{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}.zoom span{font-size:12px;color:var(--mut);min-width:40px;text-align:center}.zoom div{display:flex;gap:6px;align-items:center}
.dl{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.dl input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:15px;background:var(--field);color:var(--ink)}
.dl input[type=color]{width:30px;height:30px;border:none;background:none;padding:0;border-radius:50%}
.dl.sel{background:#38383c;border-radius:8px}
label.s{font-size:14px;color:var(--mut)}label.s select{font-size:15px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px}label.s input{width:60px;font-size:15px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px}
h3{font-size:12px;margin:4px 0 8px;letter-spacing:.12em;color:var(--mut);font-weight:600}
button.ib{background:transparent;padding:2px 6px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}button.ib small{font-size:9px;color:var(--mut)}
@media(max-width:480px){header h1{display:none}}
#editor[hidden],#home[hidden]{display:none!important}
#home{max-width:900px;margin:auto;padding:16px 14px 110px}
#home h2{font-size:28px;margin:6px 0 14px;font-weight:700;letter-spacing:.04em}
.hbar{display:flex;gap:8px;align-items:center}.hbar input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:11px 16px;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--mut);font-size:14px}.tile b{font-size:22px;color:var(--ink)}
.works{display:grid;gap:10px}@media(min-width:700px){.works{grid-template-columns:1fr 1fr}}
.wc{display:flex;background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;min-height:110px}
.wc .th{width:38%;max-width:150px;background:#38383c;flex:none;display:flex;align-items:center;padding:8px}.wc .th svg{width:100%;height:auto}
.wc .in{flex:1;min-width:0;padding:12px 40px 12px 14px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.wc .t{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wc .m{font-size:12.5px;color:var(--mut)}
.wc .menu{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;font-size:20px;padding:6px 10px}
.pop{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.pop>div{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
.pop button{display:block;width:100%;text-align:left;border-radius:10px;margin:4px 0;padding:13px 14px;font-size:16px}.pop .dng{color:#ff8a80}
.fab{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:var(--acc);color:#1c1c1e;font-size:34px;line-height:1;box-shadow:0 6px 20px #0008;z-index:10}
.empty{color:var(--mut);text-align:center;padding:40px 0;font-size:14px}
.hicons{display:flex;gap:2px}
.fbar{display:flex;align-items:center;gap:6px}.fbar #scenes{flex:1;min-width:0;padding:4px 2px}
button.nav{width:38px;height:38px;padding:0;flex:none;font-size:13px}
#undo,#redo{width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.srow button{padding:7px 11px;font-size:13px}.hint{font-size:11px;color:var(--mut);align-self:center;margin-left:auto}
#scenes{touch-action:pan-x}.scene{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .18s}
#scenes.edit{touch-action:none}#scenes.edit .scene{animation:jig .28s ease-in-out infinite alternate}#scenes.edit .scene:nth-child(2n){animation-delay:-.14s}
#scenes .scene.drag{transition:none;animation:none;z-index:2;box-shadow:0 6px 16px #000a;filter:brightness(1.25)}
@keyframes jig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.navrow{display:flex;align-items:center;gap:8px;margin-top:8px}.navrow #coord{flex:1;margin:0}button.big{width:64px;height:52px;border-radius:16px;padding:0;display:flex;align-items:center;justify-content:center;background:#3a3a3e}
body.anim button.big,body.anim button.nav{opacity:.5}
.srow{flex-wrap:nowrap;align-items:center}.srow .hint{white-space:normal;line-height:1.3;text-align:right;font-size:10.5px}
.navrow2{display:flex;gap:10px;margin-top:10px}.navrow2 button.big{flex:1;height:52px}
#scenes{padding:2px 0 6px}
[hidden]{display:none!important}
p.note{font-size:12px;color:var(--mut)}</style></head><body>
<div id="home"></div><div id="editor" hidden><header><button id="back" class="ib" aria-label="作品一覧へ" title="作品一覧へ"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><input id="song" placeholder="曲名"><button id="exp" class="ib" aria-label="データを保存" title="データを保存"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/><path d="M12 3v12M7 10l5 5 5-5"/></svg><small>保存</small></button><button id="imp" class="ib" aria-label="データを開く" title="データを開く"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/><path d="M12 15V3M7 8l5-5 5 5"/></svg><small>開く</small></button><button id="playBtn" class="main">▶ 再生</button></header>
<div id="wrap">
<div id="left">
 <div class="card"><div id="scenes"></div>
  <div class="row srow"><button id="addS">＋追加</button><button id="dupS">複製</button><button id="delS">削除</button><button id="doneS" class="main" hidden>完了</button><button id="renS" hidden>名前変更</button><span class="hint" id="hintS">ダブルタップで名前変更・長押しで並べ替え</span></div>
  <div class="navrow2"><button id="prev2" class="big" aria-label="前のフォーメーションへ"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button id="next2" class="big" aria-label="次のフォーメーションへ"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div></div>
 <div class="card" style="margin-top:10px"><div class="zoom"><div><button id="undo" title="元に戻す" aria-label="元に戻す"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><button id="redo" title="やり直す" aria-label="やり直す"><svg style="transform:scaleX(-1)" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button></div><div><button id="zo">－</button><span id="zl">100%</span><button id="zi">＋</button><button id="zr">全体</button></div></div><div id="box" style="margin-top:8px"><svg id="stage"></svg></div><div class="navrow"><div id="coord">メンバーをタップして選択</div></div>
  <div class="row" style="justify-content:center"><button id="flip">向き切替</button><button id="png">画像保存</button></div></div>
</div>
<div id="side">
 <div class="card"><h3>メンバー</h3><div id="dancers"></div><div class="row"><button id="addD" class="main">＋メンバー追加</button></div></div>
 <div class="card" style="margin-top:10px"><h3>ステージ設定</h3>
  <div class="row"><label class="s">横幅 <input id="sw" type="number" min="2" max="30" step="0.5"></label><label class="s">奥行 <input id="sd" type="number" min="2" max="30" step="0.5"></label><label class="s">マス目 <select id="div"><option value="1">分割なし</option><option value="2">2分割</option><option value="4">4分割</option><option value="8">8分割</option></select></label><label class="s">移動秒 <input id="dur" type="number" min="0.2" max="5" step="0.1"></label></div>
  <div class="row"><input id="file" type="file" accept=".json,application/json" hidden></div>
  <p class="note">自動でこの端末に保存されます。0.25刻みでスナップ。2本指でズーム、空いている所をドラッグで移動。座標は中央=0、左右は踊る人目線。</p></div>
</div></div></div>
<script>
const COLORS=['#ff6fa5','#7ec8ff','#ffc94d','#8de0a8','#c49bff','#ff9a6b','#6be0d8','#ff8fd0'];
const KEY='bamiri-v1';const $=id=>document.getElementById(id);
function sample(){const ns=['ゆりか','みお','さき','ねね','りん'];
 const d=ns.map((n,i)=>({id:'d'+i,name:n,color:COLORS[i]}));
 const P=(a)=>Object.fromEntries(a.map((p,i)=>['d'+i,{x:p[0],y:p[1]}]));
 return{song:'WINGS デモ曲',w:8,d:6,dur:1.2,view:'dancer',dancers:d,cur:0,scenes:[
 {name:'イントロ',pos:P([[0,0.75],[-1.75,0.25],[1.75,0.25],[-0.75,-1.25],[0.75,-1.25]])},
 {name:'サビ1',pos:P([[0,1.5],[-1.25,0.75],[1.25,0.75],[-2.5,-0.25],[2.5,-0.25]])},
 {name:'Aメロ',pos:P([[-2.25,0.5],[-1.25,0],[0,-0.5],[1.25,0],[2.25,0.5]])}]}}
const ICDN=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/><path d="M12 3v12M7 10l5 5 5-5"/></svg>`,ICUP=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/><path d="M12 15V3M7 8l5-5 5 5"/></svg>`;
const WKEY='bamiri-works-v1',DAY=864e5,TRASH_DAYS=30;
let DB=null;try{DB=JSON.parse(localStorage.getItem(WKEY))}catch(e){}
if(!DB||!Array.isArray(DB.works)){DB={works:[]};let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(old&&old.scenes&&old.dancers)DB.works.push({id:'w'+Date.now(),updated:Date.now(),data:old});else DB.works.push({id:'w'+Date.now(),updated:Date.now(),data:sample()});
 localStorage.setItem(WKEY,JSON.stringify(DB))}
DB.works=DB.works.filter(w=>!w.deleted||Date.now()-w.deleted<TRASH_DAYS*DAY);
const saveDB=()=>localStorage.setItem(WKEY,JSON.stringify(DB));
let CUR=null,S=null;const HIST={};
function blank(name){return{song:name||'新しい作品',w:8,d:6,dur:1.2,view:'dancer',dancers:[],cur:0,scenes:[{name:'フォーメーション1',pos:{}}]}}
let sel=null,playing=false;
let US=[],RS=[],LAST=null;
const snapS=()=>{const o=JSON.parse(JSON.stringify(S));return JSON.stringify(o)};
const save=()=>{const j=snapS(),changed=LAST!==null&&j!==LAST;if(changed){US.push(LAST);if(US.length>100)US.shift();RS=[]}LAST=j;if(CUR){CUR.data=S;if(changed)CUR.updated=Date.now();saveDB()}if(window.$&&$('undo')){$('undo').disabled=!US.length;$('redo').disabled=!RS.length}};
function hist(from,to){if(!from.length)return;to.push(LAST);LAST=from.pop();S=JSON.parse(LAST);if(!S.dancers.some(d=>d.id===sel))sel=null;all()}
const DIVN=()=>[1,2,4,8].includes(+S.div)?+S.div:4;const snap=v=>Math.round(v*DIVN())/DIVN();
const fmt=v=>{v=Math.abs(v);return(+v.toFixed(3)).toString()};
const sc=()=>S.scenes[S.cur];
// geometry: units -> px
const U=60;let M=80,Z=1,LS=1;
function toPx(x,y){const fl=S.view==='audience'?-1:1;return[M+(WING+S.w/2+fl*x)*U,M+(S.d/2-fl*y)*U]}
function fromPx(px,py){const fl=S.view==='audience'?-1:1;return[fl*((px-M)/U-WING-S.w/2),fl*(S.d/2-(py-M)/U)]}
function posText(p){const lr=p.x===0?'センター':(p.x>0?'右 ':'左 ')+fmt(p.x);const fb=p.y===0?'中央':(p.y>0?'前 ':'後ろ ')+fmt(p.y);return lr+' / '+fb}
const WING=1;
function render(){
 M=46;const W=(S.w+2*WING)*U+2*M,H=S.d*U+2*M,svg=$('stage');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 const k=Math.min(1.8,Math.max(1,W/((svg.clientWidth||W)*Z)*0.75)),aud=S.view==='audience',L=M,T=M,R=W-M,B=H-M,sx=M+WING*U,ex=R-WING*U;
 let g=`<defs><clipPath id="cl"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}" rx="16"/></clipPath></defs><rect width="${W}" height="${H}" fill="#2a2a2d"/>`;
 g+=`<g clip-path="url(#cl)"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}" fill="#232326"/><rect x="${L}" y="${T}" width="${sx-L}" height="${B-T}" fill="#38383c"/><rect x="${ex}" y="${T}" width="${R-ex}" height="${B-T}" fill="#38383c"/>`;
 const dv=DIVN();for(let i=-(S.w/2+WING)*dv;i<=(S.w/2+WING)*dv;i++){const v=i/dv,[x]=toPx(v,0);if(x<=L||x>=R)continue;const int=Number.isInteger(v);
  g+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${B}" stroke="${int?'#4a4a4f':(v*2%1===0?'#323236':'#2c2c30')}" stroke-width="${int?1.2:0.7}"/>`}
 for(let i=-S.d*dv;i<=S.d*dv;i++){const v=i/dv,[,y]=toPx(0,v);if(y<=T||y>=B)continue;const int=Number.isInteger(v);
  g+=`<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="${int?'#4a4a4f':(v*2%1===0?'#323236':'#2c2c30')}" stroke-width="${int?1.2:0.7}"/>`}
 g+=`</g><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}" rx="16" fill="none" stroke="#9a9aa0" stroke-width="2"/>`;
 const cx=W/2,cy=H/2,t=10;
 g+=`<g stroke="#9a9aa0" stroke-width="2"><line x1="${cx}" y1="${T-t}" x2="${cx}" y2="${T+t}"/><line x1="${cx}" y1="${B-t}" x2="${cx}" y2="${B+t}"/><line x1="${L-t}" y1="${cy}" x2="${L+t}" y2="${cy}"/><line x1="${R-t}" y1="${cy}" x2="${R+t}" y2="${cy}"/>`;
 g+=`<line x1="${cx-7}" y1="${cy-7}" x2="${cx+7}" y2="${cy+7}"/><line x1="${cx+7}" y1="${cy-7}" x2="${cx-7}" y2="${cy+7}"/></g>`;
 g+=`<text x="${cx}" y="${aud?B+32:T-20}" text-anchor="middle" font-size="${15*k}" font-weight="600" fill="#ececee">観客</text><text x="${cx}" y="${aud?T-20:B+32}" text-anchor="middle" font-size="${14*k}" fill="#9a9aa0">舞台裏</text>`;
 g+=`<text x="${R}" y="${aud?B+32:T-20}" text-anchor="end" font-size="12" fill="#77777d">${aud?'客席から見た図':'踊る人目線'}</text>`;
 S.dancers.forEach(d=>{const p=sc().pos[d.id];if(!p)return;const[x,y]=toPx(p.x,p.y),on=sel===d.id;
  g+=`<g class="dn" data-id="${d.id}" style="cursor:grab"><circle cx="${x}" cy="${y}" r="${24*k}" fill="transparent"/>${on?`<circle cx="${x}" cy="${y}" r="${17*k}" fill="none" stroke="#ececee" stroke-width="2.5"/>`:''}<circle cx="${x}" cy="${y}" r="${13*k}" fill="${d.color}"/><text x="${x}" y="${y+3.5*k}" text-anchor="middle" font-size="${9.5*k}" font-weight="700" fill="#fff" pointer-events="none">${esc(d.name.slice(0,2))}</text><text x="${x}" y="${y+27*k}" text-anchor="middle" font-size="${10*k}" fill="#c8c8cc" pointer-events="none">${esc(d.name.slice(0,4))}</text></g>`});
 svg.innerHTML=g;
 $('coord').textContent=sel&&sc().pos[sel]?`${S.dancers.find(d=>d.id===sel).name}：${posText(sc().pos[sel])}`:'メンバーをタップして選択';
 if($('prev2')){$('prev2').disabled=S.cur<=0;$('next2').disabled=S.cur>=S.scenes.length-1}if($('undo')){$('undo').disabled=!US.length;$('redo').disabled=!RS.length}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderScenes(){$('scenes').innerHTML=S.scenes.map((s,i)=>`<div class="scene ${i===S.cur?'on':''}" data-i="${i}">${i+1}. ${esc(s.name)}</div>`).join('')}
function renderDancers(){$('dancers').innerHTML=S.dancers.map(d=>`<div class="dl ${sel===d.id?'sel':''}" data-id="${d.id}"><input type="color" value="${d.color}"><input type="text" value="${esc(d.name)}"><button class="del">✕</button></div>`).join('')}
function all(){render();renderScenes();renderDancers();$('song').value=S.song||'';$('sw').value=S.w;$('sd').value=S.d;$('dur').value=S.dur;$('div').value=DIVN();save()}
// drag / pan / pinch
let drag=null;const svg=$('stage'),box=$('box'),pts=new Map();let pinch=null,pan=null;
function svgPt(e){const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return[(e.clientX-r.left)*vb.width/r.width,(e.clientY-r.top)*vb.height/r.height]}
function setZoom(z,cx,cy){z=Math.max(1,Math.min(4,z));const r=box.getBoundingClientRect();cx=cx??r.left+r.width/2;cy=cy??r.top+r.height/2;
 const fx=(box.scrollLeft+cx-r.left)/(svg.clientWidth||1),fy=(box.scrollTop+cy-r.top)/(svg.clientHeight||1);Z=z;svg.style.width=(100*Z)+'%';render();svg.style.maxHeight=Z>1?'none':'calc(100vh - 200px)';
 box.scrollLeft=fx*svg.clientWidth-(cx-r.left);box.scrollTop=fy*svg.clientHeight-(cy-r.top);$('zl').textContent=Math.round(Z*100)+'%'}
const dist=()=>{const[a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);e.preventDefault();
 if(pts.size===2){drag=null;pan=null;const[a,b]=[...pts.values()];pinch={d:dist(),z:Z};return}
 if(playing)return;const g=e.target.closest('.dn');
 if(!g){pan={x:e.clientX,y:e.clientY,sl:box.scrollLeft,st:box.scrollTop,moved:false};return}
 sel=g.dataset.id;drag=sel;render();renderDancers()});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&pts.size===2){const[a,b]=[...pts.values()];setZoom(pinch.z*dist()/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);return}
 if(pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.abs(dx)+Math.abs(dy)>4)pan.moved=true;box.scrollLeft=pan.sl-dx;box.scrollTop=pan.st-dy;return}
 if(!drag)return;let[x,y]=fromPx(...svgPt(e));x=Math.max(-S.w/2-WING,Math.min(S.w/2+WING,snap(x)));y=Math.max(-S.d/2,Math.min(S.d/2,snap(y)));
 const p=sc().pos[drag];if(p.x!==x||p.y!==y){p.x=x;p.y=y;render()}});
const end=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pan&&!pan.moved&&!pts.size){sel=null;render();renderDancers()}if(!pts.size)pan=null;if(drag){drag=null;save()}};
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
box.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(Z*(e.deltaY<0?1.1:0.9),e.clientX,e.clientY)}},{passive:false});
$('zi').onclick=()=>setZoom(Z*1.4);$('zo').onclick=()=>setZoom(Z/1.4);$('zr').onclick=()=>setZoom(1);

// dancers
$('dancers').addEventListener('input',e=>{const id=e.target.closest('.dl').dataset.id,d=S.dancers.find(x=>x.id===id);
 if(e.target.type==='color')d.color=e.target.value;else d.name=e.target.value;render();save()});
$('dancers').addEventListener('click',e=>{const row=e.target.closest('.dl');if(!row)return;const id=row.dataset.id;
 if(e.target.classList.contains('del')){if(!confirm('このメンバーを削除しますか？'))return;S.dancers=S.dancers.filter(d=>d.id!==id);S.scenes.forEach(s=>delete s.pos[id]);if(sel===id)sel=null;all();return}
 if(e.target.tagName!=='INPUT'){sel=id;render();renderDancers()}});
$('addD').onclick=()=>{const id='d'+Date.now(),n=S.dancers.length;S.dancers.push({id,name:'メンバー'+(n+1),color:COLORS[n%COLORS.length]});
 S.scenes.forEach(s=>s.pos[id]={x:0,y:0});sel=id;all()};
// scenes
let LT={i:-1,t:0};$('scenes').onclick=e=>{if(SUPPRESS){SUPPRESS=false;return}const t=e.target.closest('.scene');if(!t||playing||EDIT||ANIM)return;const i=+t.dataset.i,now=Date.now();
 if(LT.i===i&&now-LT.t<400){LT={i:-1,t:0};S.cur=i;$('renS').click();return}LT={i,t:now};if(S.cur!==i){S.cur=i;all()}};
const clone=o=>JSON.parse(JSON.stringify(o));
$('addS').onclick=()=>{const s={name:'フォーメーション'+(S.scenes.length+1),pos:clone(sc().pos)};S.scenes.splice(S.cur+1,0,s);S.cur++;all()};
$('dupS').onclick=()=>{const s=clone(sc());s.name+='（コピー）';S.scenes.splice(S.cur+1,0,s);S.cur++;all()};
$('renS').onclick=()=>{const n=prompt('名前（例：サビ1）',sc().name);if(n){sc().name=n;all()}};
$('delS').onclick=()=>{if(S.scenes.length<2)return alert('最後の1つは消せません');if(!confirm(`「${sc().name}」を削除しますか？`))return;S.scenes.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);all()};
const mv=k=>{const j=S.cur+k;if(j<0||j>=S.scenes.length)return;[S.scenes[S.cur],S.scenes[j]]=[S.scenes[j],S.scenes[S.cur]];S.cur=j;all()};

// formation nav + long-press reorder
let EDIT=false,LP=null,DR=null,SUPPRESS=false;
function setEdit(on){EDIT=on;$('scenes').classList.toggle('edit',on);$('doneS').hidden=!on;$('hintS').hidden=on;['addS','dupS','delS'].forEach(i=>$(i).hidden=on)}
let ANIM=false;const nav=async k=>{const j=S.cur+k;if(j<0||j>=S.scenes.length||playing||ANIM||EDIT)return;ANIM=true;document.body.classList.add('anim');try{await tween(S.cur,j)}finally{ANIM=false;document.body.classList.remove('anim')}S.cur=j;all();const t=$('scenes').children[j];t&&t.scrollIntoView({inline:'nearest',block:'nearest'})};
$('prev2').onclick=()=>nav(-1);$('next2').onclick=()=>nav(1);$('doneS').onclick=()=>setEdit(false);
const SC=$('scenes');
SC.addEventListener('contextmenu',e=>e.preventDefault());
SC.addEventListener('touchmove',e=>{if(DR||EDIT)e.preventDefault()},{passive:false});
function startDrag(t,e){const tabs=[...SC.children],from=tabs.indexOf(t);DR={from,to:from,x0:e.clientX,id:e.pointerId,tabs,rects:tabs.map(x=>x.getBoundingClientRect()),el:t};t.classList.add('drag');try{SC.setPointerCapture(e.pointerId)}catch(_){}}
SC.addEventListener('pointerdown',e=>{const t=e.target.closest('.scene');if(!t||playing)return;
 if(EDIT){e.preventDefault();startDrag(t,e);return}
 LP={x:e.clientX,y:e.clientY,t,timer:setTimeout(()=>{setEdit(true);SUPPRESS=true;startDrag(t,{clientX:LP.x,pointerId:e.pointerId});if(navigator.vibrate)navigator.vibrate(15)},450)}});
SC.addEventListener('pointermove',e=>{if(LP&&!DR){if(Math.hypot(e.clientX-LP.x,e.clientY-LP.y)>8){clearTimeout(LP.timer);LP=null}else LP.x=e.clientX;return}
 if(!DR)return;const dx=e.clientX-DR.x0,r=DR.rects,f=DR.from,c=r[f].left+r[f].width/2+dx,gap=6;
 let to=0;r.forEach((q,j)=>{if(j!==f&&q.left+q.width/2<c)to++});DR.to=to;
 DR.tabs.forEach((el,j)=>{if(j===f){el.style.transform=`translateX(${dx}px) scale(1.06)`;return}
  let sh=0;if(f<to&&j>f&&j<=to)sh=-(r[f].width+gap);if(to<f&&j>=to&&j<f)sh=r[f].width+gap;el.style.transform=sh?`translateX(${sh}px)`:''})});
function endDrag(){if(LP){clearTimeout(LP.timer);LP=null}if(!DR)return;const{from,to}=DR;DR=null;setTimeout(()=>SUPPRESS=false,400);
 if(from!==to){const curScene=S.scenes[S.cur];const [m]=S.scenes.splice(from,1);S.scenes.splice(to,0,m);S.cur=S.scenes.indexOf(curScene)}
 all()}
SC.addEventListener('pointerup',endDrag);SC.addEventListener('pointercancel',endDrag);
document.addEventListener('pointerdown',e=>{if(EDIT&&!e.target.closest('#scenes,#doneS'))setEdit(false)},true);

// settings
$('song').oninput=e=>{S.song=e.target.value;render();save()};
const num=(id,k,mn)=>$(id).onchange=e=>{const v=parseFloat(e.target.value);if(v>=mn){S[k]=k==='dur'?v:Math.round(v*2)/2;all()}};
$('div').onchange=e=>{S.div=+e.target.value;all()};num('sw','w',2);num('sd','d',2);num('dur','dur',0.2);
$('flip').onclick=()=>{S.view=S.view==='audience'?'dancer':'audience';all()};
// play
function tween(i,j,stop){const a=S.scenes[i].pos,b=S.scenes[j].pos,t0=performance.now(),D=S.dur*1000,orig=S.scenes[i];S.cur=i;
 return new Promise(res=>{const f=now=>{let t=Math.min(1,(now-t0)/D);if(stop&&stop())t=1;const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const tmp={name:S.scenes[j].name,pos:{}};for(const id in b){const p=a[id]||b[id];tmp.pos[id]={x:p.x+(b[id].x-p.x)*e,y:p.y+(b[id].y-p.y)*e}}
  S.scenes[i]=tmp;render();S.scenes[i]=orig;t<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)})}
$('playBtn').onclick=async()=>{if(playing){playing=false;return}playing=true;$('playBtn').textContent='■ 停止';sel=null;
 const start=S.cur>=S.scenes.length-1?0:S.cur;S.cur=start;render();await wait(600);
 for(let i=start;i<S.scenes.length-1&&playing;i++){await tween(i,i+1,()=>!playing);
  S.cur=i+1;all();await wait(700)}
 playing=false;$('playBtn').textContent='▶ 再生';all()};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// io
$('exp').onclick=()=>dl(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),(S.song||'bamiri')+'.json');
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{let n=0,last=null;try{const o=JSON.parse(t);
 const list=o&&Array.isArray(o.works)?o.works.map(w=>w.data||w):[o];
 for(const d of list){if(!d||!d.scenes||!d.dancers)continue;d.cur=0;last={id:'w'+Date.now()+'_'+(n++),updated:Date.now(),data:d};DB.works.push(last)}
 if(!n)throw 0;saveDB();if(n===1&&!$('editor').hidden)openWork(last.id);else{showHome();}}catch(_){alert('読み込めないファイルです')}});e.target.value=''};

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('png').onclick=()=>{const s0=sel;sel=null;render();const vb=svg.viewBox.baseVal,k=3;
 const x=new XMLSerializer().serializeToString(svg).replace('<svg',`<svg xmlns="http://www.w3.org/2000/svg" width="${vb.width}" height="${vb.height}" font-family="sans-serif"`);
 sel=s0;render();const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=vb.width*k;c.height=vb.height*k;const ctx=c.getContext('2d');ctx.scale(k,k);ctx.drawImage(img,0,0);
 c.toBlob(b=>dl(b,`${S.song||'bamiri'}_${sc().name}.png`))};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)};
$('undo').onclick=()=>hist(US,RS);$('redo').onclick=()=>hist(RS,US);
addEventListener('resize',()=>{if(CUR)render()});
function ago(t){const m=(Date.now()-t)/6e4;if(m<1)return'たった今';if(m<60)return Math.floor(m)+'分前';const h=m/60;if(h<24)return Math.floor(h)+'時間前';const d=h/24;if(d<30)return Math.floor(d)+'日前';const mo=d/30;if(mo<12)return Math.floor(mo)+'か月前';return Math.floor(mo/12)+'年前'}
function thumb(d){const sc0=d.scenes[0]||{pos:{}},w=d.w+2,h=d.d,k=20;let g=`<svg viewBox="0 0 ${w*k} ${h*k}"><rect x="1" y="1" width="${w*k-2}" height="${h*k-2}" rx="6" fill="#232326" stroke="#5a5a60"/>`;
 const fl=d.view==='audience'?-1:1;for(const dn of d.dancers){const p=sc0.pos[dn.id];if(!p)continue;g+=`<circle cx="${(w/2+fl*p.x)*k}" cy="${(h/2-fl*p.y)*k}" r="${k*0.28}" fill="${dn.color}"/>`}return g+'</svg>'}
let Q='',VIEW='list';
function showHome(){if(playing)playing=false;CUR=null;$('editor').hidden=true;$('home').hidden=false;renderHome();scrollTo(0,0)}
function renderHome(){const live=DB.works.filter(w=>!w.deleted),tr=DB.works.filter(w=>w.deleted);
 const list=(VIEW==='trash'?tr:live).filter(w=>(w.data.song||'').toLowerCase().includes(Q.toLowerCase())).sort((a,b)=>(VIEW==='trash'?b.deleted-a.deleted:b.updated-a.updated));
 const h=$('home');const qv=Q;
 h.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between">${VIEW==='trash'?`<h2><button class="ib" id="hback" aria-label="戻る" style="display:inline-flex;vertical-align:middle">←</button> 最近削除したもの</h2>`:`<h2>作品</h2>`}
 <div class="hicons"><button class="ib" id="himp" aria-label="データを開く" title="データを開く">${ICUP}<small>開く</small></button><button class="ib" id="hexp" aria-label="すべて保存" title="すべての作品を保存">${ICDN}<small>全部保存</small></button></div></div>
 <div class="hbar"><input id="q" type="search" placeholder="検索…" value="${esc(qv)}"></div>
 ${VIEW==='list'?`<div class="tiles"><div class="tile" style="cursor:default">作品<b>${live.length}</b></div><div class="tile" id="trash">最近削除したもの<b>${tr.length}</b></div></div>`:`<p class="note">削除してから${TRASH_DAYS}日たつと完全に消えます。</p>`}
 <div class="works">${list.map(w=>{const d=w.data;return`<div class="wc" data-id="${w.id}"><div class="th">${thumb(d)}</div><div class="in"><div class="t">${esc(d.song||'無題')}</div><div class="m">${d.scenes.length}フォーメーション ・ ${d.dancers.length}人</div><div class="m">${VIEW==='trash'?'削除 '+ago(w.deleted):'✎ '+ago(w.updated)}</div></div><button class="menu" aria-label="メニュー">⋮</button></div>`}).join('')||`<div class="empty">${VIEW==='trash'?'ありません':'作品がありません。＋で作成'}</div>`}</div>
 ${VIEW==='list'?'<button class="fab" id="fab" aria-label="新しい作品">＋</button>':''}`;
 const q=$('q');q.oninput=e=>{Q=e.target.value;renderHome();const n=$('q');n.focus();n.setSelectionRange(Q.length,Q.length)};
 $('himp').onclick=()=>$('file').click();
 $('hexp').onclick=()=>dl(new Blob([JSON.stringify({app:'bamiri',works:live.map(w=>({updated:w.updated,data:w.data}))},null,1)],{type:'application/json'}),'バミリ_全作品.json');
 if($('fab'))$('fab').onclick=newWork;if($('trash'))$('trash').onclick=()=>{VIEW='trash';renderHome()};if($('hback'))$('hback').onclick=()=>{VIEW='list';renderHome()};
 h.querySelectorAll('.wc').forEach(c=>c.onclick=e=>{const id=c.dataset.id;if(e.target.closest('.menu'))return menu(id);if(VIEW==='list')openWork(id);else menu(id)})}
function newWork(){const n=prompt('曲名を入力してください','');if(n===null)return;const w={id:'w'+Date.now(),updated:Date.now(),data:blank(n.trim()||'新しい作品')};DB.works.push(w);saveDB();openWork(w.id)}
function menu(id){const w=DB.works.find(x=>x.id===id);const p=document.createElement('div');p.className='pop';
 p.innerHTML=`<div><div style="padding:6px 14px;color:var(--mut);font-size:13px">${esc(w.data.song||'無題')}</div>${w.deleted?'<button data-a="restore">元に戻す</button><button data-a="purge" class="dng">完全に削除</button>':'<button data-a="open">開く</button><button data-a="rename">名前を変更</button><button data-a="dup">複製</button><button data-a="del" class="dng">削除</button>'}<button data-a="x">キャンセル</button></div>`;
 p.onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(e.target===p||a==='x'){p.remove();return}if(!a)return;p.remove();
  if(a==='open')openWork(id);
  if(a==='rename'){const n=prompt('曲名',w.data.song);if(n){w.data.song=n;w.updated=Date.now()}}
  if(a==='dup'){const c=JSON.parse(JSON.stringify(w));c.id='w'+Date.now();c.updated=Date.now();c.data.song+='（コピー）';DB.works.push(c)}
  if(a==='del'&&confirm(`「${w.data.song}」を削除しますか？\n（${TRASH_DAYS}日間は「最近削除したもの」から戻せます）`))w.deleted=Date.now();
  if(a==='restore'){delete w.deleted;w.updated=Date.now()}
  if(a==='purge'&&confirm('完全に削除します。元に戻せません。'))DB.works=DB.works.filter(x=>x!==w);
  saveDB();if(a!=='open')renderHome()};document.body.appendChild(p)}
function openWork(id){const w=DB.works.find(x=>x.id===id);if(!w)return;setEdit(false);if(CUR)HIST[CUR.id]={US,RS};
 CUR=w;S=w.data;if(!S.scenes.length)S.scenes.push({name:'フォーメーション1',pos:{}});S.cur=Math.min(S.cur||0,S.scenes.length-1);
 const h=HIST[id]||{US:[],RS:[]};US=h.US;RS=h.RS;LAST=null;sel=null;Z=1;
 $('home').hidden=true;$('editor').hidden=false;setZoom(1);all();scrollTo(0,0)}
$('back').onclick=()=>{if(CUR)HIST[CUR.id]={US,RS};showHome()};
showHome();svg.style.maxHeight='calc(100vh - 200px)';
</script></body></html>
